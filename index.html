<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Calendar</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #F4EEE2;
      --paper-card: rgba(255, 252, 245, .76);
      --paper-solid: #FBF7EF;
      --ink: #292923;
      --muted: #89877D;
      --line: rgba(70, 67, 54, .12);
      --teal: #175E63;
      --teal-soft: rgba(23, 94, 99, .11);
      --amber: #B47B32;
      --amber-soft: rgba(180, 123, 50, .13);
      --red: #B96859;
      --red-soft: rgba(185, 104, 89, .13);
      --bluegray: #718596;
      --olive: #81865B;
      --shadow: 0 12px 34px rgba(65, 53, 32, .07);
      --grid: rgba(97, 91, 72, .075);
      --radius: 20px;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #1B1814;
      --paper-card: rgba(42, 37, 30, .76);
      --paper-solid: #28231D;
      --ink: #EEE8DC;
      --muted: #A39B8D;
      --line: rgba(226, 214, 190, .12);
      --teal: #57ADAF;
      --teal-soft: rgba(87, 173, 175, .14);
      --amber: #D4A45D;
      --amber-soft: rgba(212, 164, 93, .15);
      --red: #D58A78;
      --red-soft: rgba(213, 138, 120, .14);
      --bluegray: #91A9B8;
      --olive: #A8AC79;
      --shadow: 0 14px 36px rgba(0, 0, 0, .18);
      --grid: rgba(218, 205, 179, .055);
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: auto
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        radial-gradient(ellipse at 91% 5%, rgba(55, 145, 139, .17), transparent 29rem),
        radial-gradient(ellipse at 7% 90%, rgba(202, 145, 65, .14), transparent 27rem);
      background-size: 22px 22px, 22px 22px, auto, auto;
      font-family: "Avenir Next", "Helvetica Neue", "Hiragino Sans GB", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      font-feature-settings: "tnum" 1, "ss01" 1;

    }

    button {
      font: inherit
    }

    .page {
      width: min(1440px, 100%);
      margin: auto;
      padding: 34px clamp(16px, 3vw, 42px) 64px
    }

    h1 {
      font-family: "Bodoni 72", "Didot", "Songti SC", serif;
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 500;
      letter-spacing: .08em;
      margin: 1px 0 0
    }

    .theme-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 1000;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 9999px;
      background: var(--paper-card);
      color: var(--ink);
      font: 600 16px/1 inherit;
      cursor: pointer;
      box-shadow: var(--shadow)
    }

    .panel {
      background: var(--paper-card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .main-layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 24px;
      align-items: start
    }

    .progress-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 13px
    }

    section+section {
      margin-top: 38px
    }

    .main-layout section+section {
      margin-top: 0
    }

    .progress-card {
      padding: 17px 18px;
      display: flex;
      align-items: center;
      gap: 15px;
      min-height: 132px
    }

    .ring {
      width: 82px;
      height: 82px;
      flex: 0 0 82px;
      position: relative
    }

    .ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible
    }

    .ring circle {
      fill: none;
      stroke-width: 7
    }

    .ring .track {
      stroke: var(--line)
    }

    .ring .value {
      stroke: var(--teal);
      stroke-linecap: round;
      transition: stroke-dashoffset .45s ease
    }

    .ring-center {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center
    }

    .ring-percent {
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -.055em;
      font-variant-numeric: tabular-nums
    }

    .ring-caption {
      font-size: 9px;
      color: var(--muted);
      margin-top: 1px
    }

    .investment-mark {
      width: 82px;
      height: 82px;
      flex: 0 0 82px;
      display: grid;
      place-content: center;
      text-align: center;
      border: 1px solid var(--teal);
      border-radius: 50%;
      color: var(--teal)
    }

    .investment-number {
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -.06em;
      font-variant-numeric: tabular-nums;
      line-height: 1
    }

    .investment-unit {
      font-size: 9px;
      color: var(--muted);
      margin-top: 3px
    }

    .progress-info {
      min-width: 0;
      flex: 1
    }

    .period-name {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px
    }

    .period-dates {
      font-size: 10px;
      color: var(--muted);
      line-height: 1.55
    }

    .period-foot {
      font-size: 10px;
      color: var(--muted);
      margin-top: 9px;
      display: flex;
      flex-wrap: wrap;
      gap: 3px 9px
    }

    .period-foot strong {
      color: var(--teal);
      font-weight: 700
    }

    .calendar-panel {
      padding: 17px
    }

    .calendar-toolbar strong {
      font-family: Georgia, "Songti SC", serif;
      font-size: 16px;
      font-weight: 600
    }

    .legend-dot.today-dot {
      background: var(--teal)
    }

    .week-head,
    .week-row {
      display: grid;
      grid-template-columns: 72px repeat(7, minmax(0, 1fr));
      gap: 7px;
      align-items: stretch
    }

    .week-head {
      padding: 0 8px 8px
    }

    .week-head span {
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      font-weight: 650
    }

    .week-head span:first-child {
      text-align: left
    }

    .weeks {
      display: flex;
      flex-direction: column;
      gap: 7px
    }

    .week-row {
      padding: 2px 0;
      contain: layout style
    }

    .week-row.current-week .week-number {
      color: var(--amber)
    }

    .week-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0
    }

    .week-number {
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .02em;
      color: var(--teal);
      font-variant-numeric: tabular-nums
    }

    .day-cell {
      min-width: 0;
      min-height: 54px;
      border: 1px solid var(--line);
      background: var(--paper-card);
      border-radius: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      position: relative;
      color: var(--ink);
      box-shadow: none
    }

    .week-row.current-week .day-cell:not(.empty) {
      border-color: color-mix(in srgb, var(--teal) 30%, var(--line))
    }

    .day-cell.empty {
      visibility: hidden;
      border-color: transparent;
      background: transparent;
      box-shadow: none
    }

    .day-number {
      font-family: "Bodoni 72", "Didot", "Georgia", serif;
      font-size: 17px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      line-height: 1
    }

    .day-month {
      font-size: 9px;
      color: var(--muted);
      min-height: 12px
    }

    .day-cell.today {
      background: var(--teal);
      color: #FBF7EF
    }

    .day-cell.today .day-month {
      color: rgba(255, 255, 255, .76)
    }

    .day-cell.holiday:not(.today) {
      background: var(--red-soft);
      color: var(--red)
    }

    .day-cell.holiday .day-month {
      color: var(--red)
    }

    .day-cell.memorial:not(.today) {
      background: rgba(113, 133, 150, .13);
      color: var(--bluegray)
    }

    .day-cell.special-olive:not(.today) {
      background: rgba(129, 134, 91, .14);
      color: var(--olive)
    }

    .day-label {
      font-size: 8px;
      line-height: 1.1;
      max-width: 95%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .day-cell.today .day-label {
      color: #fff
    }

    @media(max-width:850px) {
      .main-layout {
        grid-template-columns: 1fr;
        gap: 38px
      }

      .progress-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }

      .week-head,
      .week-row {
        grid-template-columns: 58px repeat(7, minmax(0, 1fr));
        gap: 4px
      }

      .day-cell {
        min-height: 50px
      }
    }

    @media(max-width:560px) {
      .page {
        padding: 20px 12px 40px
      }

      .theme-toggle {
        top: 12px;
        right: 12px;
        width: 36px;
        height: 36px
      }

      .progress-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px
      }

      .progress-card {
        padding: 12px 10px;
        gap: 9px;
        min-height: 106px
      }

      .ring {
        width: 62px;
        height: 62px;
        flex-basis: 62px
      }

      .investment-mark {
        width: 62px;
        height: 62px;
        flex-basis: 62px
      }

      .investment-number {
        font-size: 18px
      }

      .ring circle {
        stroke-width: 8
      }

      .ring-percent {
        font-size: 13px
      }

      .ring-caption {
        font-size: 8px
      }

      .period-name {
        font-size: 12px
      }

      .period-dates {
        font-size: 9px
      }

      .period-foot {
        font-size: 9px;
        margin-top: 5px
      }

      .calendar-panel {
        padding: 10px 7px
      }

      .calendar-toolbar {
        align-items: flex-start;
        flex-direction: column;
        padding: 3px 5px 12px
      }

      .week-head,
      .week-row {
        grid-template-columns: 34px repeat(7, minmax(0, 1fr));
        gap: 4px
      }

      .week-head {
        padding: 0 3px 6px
      }

      .week-row {
        padding: 2px 0
      }

      .week-number {
        font-size: 9px
      }

      .day-cell {
        min-height: 46px;
        border-radius: 8px
      }

      .day-number {
        font-size: 12px
      }

      .day-month {
        font-size: 8px
      }

      .day-label {
        font-size: 7px
      }
    }

    @media(max-width:370px) {
      .progress-grid {
        grid-template-columns: 1fr
      }

      .progress-card {
        min-height: 94px
      }

      .ring {
        width: 70px;
        height: 70px;
        flex-basis: 70px
      }

      .investment-mark {
        width: 70px;
        height: 70px;
        flex-basis: 70px
      }
    }
  </style>
</head>

<body>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深浅色模式" title="切换深浅色模式">◑</button>
  <main class="page">

    <div class="main-layout">
      <section>
        <div class="progress-grid" id="progress-grid"></div>
      </section>

      <section>
        <div class="panel calendar-panel">
          <div class="week-head">
            <span>周数</span><span>星期一</span><span>星期二</span><span>星期三</span><span>星期四</span><span>星期五</span><span>星期六</span><span>星期日</span>
          </div>
          <div class="weeks" id="weeks"></div>
        </div>
      </section>
    </div>
  </main>
  <script>
    const DAY = 86400000;
    const pad = n => String(n).padStart(2, "0");
    const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const dateOnly = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
    const fmt = d => `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
    const diffDays = (a, b) => Math.round((dateOnly(b) - dateOnly(a)) / DAY);
    const isoWeek = d => {
      const x = dateOnly(d); x.setDate(x.getDate() + 3 - ((x.getDay() + 6) % 7));
      const first = new Date(x.getFullYear(), 0, 4); first.setDate(first.getDate() + 3 - ((first.getDay() + 6) % 7));
      return 1 + Math.round((x - first) / (7 * DAY));
    };
    function periods(now) {
      const y = now.getFullYear(), m = now.getMonth(), q = Math.floor(m / 3), dec = Math.floor(y / 10) * 10, cent = Math.floor((y - 1) / 100) * 100 + 1;
      return [
        [`${m + 1}月`, new Date(y, m, 1), new Date(y, m + 1, 0)],
        [`Q${q + 1}`, new Date(y, q * 3, 1), new Date(y, q * 3 + 3, 0)],
        [m < 6 ? "H1" : "H2", new Date(y, m < 6 ? 0 : 6, 1), new Date(y, m < 6 ? 6 : 12, 0)],
        [`${y}`, new Date(y, 0, 1), new Date(y, 11, 31)],
        [`${dec}s`, new Date(dec, 0, 1), new Date(dec + 9, 11, 31)],
        [`${Math.ceil(y / 100)}世纪`, new Date(cent, 0, 1), new Date(cent + 99, 11, 31)]
      ];
    }
    class ProgressRing extends HTMLElement {
      set data(v) { this._data = v; this.render() }
      connectedCallback() { if (this._data) this.render() }
      render() {
        if (!this._data) return;
        const { name, start, end, now } = this._data, total = diffDays(start, addDays(end, 1));
        const elapsed = Math.max(0, Math.min(total, diffDays(start, now) + 1));
        const pct = Math.max(0, Math.min(100, elapsed / total * 100)), remain = Math.max(0, diffDays(now, end));
        const r = 34, c = 2 * Math.PI * r, offset = c * (1 - pct / 100);
        this.innerHTML = `<article class="panel progress-card">
   <div class="ring"><svg viewBox="0 0 80 80" aria-hidden="true"><circle class="track" cx="40" cy="40" r="${r}"/><circle class="value" cx="40" cy="40" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/></svg><div class="ring-center"><span class="ring-percent">${pct.toFixed(1)}%</span><span class="ring-caption">已完成</span></div></div>
   <div class="progress-info"><div class="period-name">${name}</div><div class="period-dates">${fmt(start)} — ${fmt(end)}</div><div class="period-foot"><span>已过 <strong>${elapsed}</strong> 天</span><span>剩余 <strong>${remain}</strong> 天</span></div></div>
  </article>`;
      }
    }
    customElements.define("progress-ring", ProgressRing);

    const holidayRanges = [
      ["元旦", "2027-01-01", "2027-01-01"],
      ["春节", "2027-02-05", "2027-02-13"],
      ["清明", "2027-04-03", "2027-04-05"],
      ["五一", "2027-05-01", "2027-05-05"],
      ["端午", "2027-06-09", "2027-06-09"],
      ["中秋", "2027-09-15", "2027-09-15"],
      ["十一", "2027-10-01", "2027-10-07"]
    ];
    const holidayMap = new Map();
    for (const [name, from, to] of holidayRanges) {
      for (let d = new Date(from + "T12:00:00"); dateKey(d) <= to; d = addDays(d, 1))holidayMap.set(dateKey(d), name);
    }
    // 可扩展纪念日：日期 -> 显示名称；不同类别使用低饱和蓝灰或橄榄色。
    const memorials = {
      // "2027-10-14":{name:"生日",tone:"blue"},
      // "2027-09-23":{name:"纪念日",tone:"olive"}
    };
    function renderWeeks(today, start, end) {
      const root = document.getElementById("weeks");
      const fragment = document.createDocumentFragment();
      let weekStart = new Date(start);
      while (weekStart <= end) {
        const weekEnd = addDays(weekStart, 6);
        const row = document.createElement("div");
        const isCurrent = today >= weekStart && today <= weekEnd;
        row.className = "week-row" + (isCurrent ? " current-week" : "");
        const meta = document.createElement("div"); meta.className = "week-meta";
        meta.innerHTML = `<span class="week-number">W${String(isoWeek(weekStart)).padStart(2, "0")}</span>`;
        row.append(meta);
        for (let i = 0; i < 7; i++) {
          const d = addDays(weekStart, i), cell = document.createElement("div");
          const key = dateKey(d), holiday = holidayMap.get(key), mem = memorials[key], isToday = key === dateKey(today), inRange = d >= start && d <= end;
          cell.className = "day-cell" + (!inRange ? " empty" : "") + (isToday ? " today" : "") + (holiday ? " holiday" : "") + (mem && !holiday ? (mem.tone === "olive" ? " special-olive" : " memorial") : "");
          const label = holiday || mem?.name || "";
          const number = document.createElement("span");
          number.className = "day-number";
          number.textContent = String(d.getDate());
          const monthLabel = document.createElement("span");
          monthLabel.className = "day-month";
          monthLabel.textContent = d.getDate() === 1 || i === 0 ? `${d.getMonth() + 1}月` : "";
          cell.append(number, monthLabel);
          if (label) {
            const dayLabel = document.createElement("span");
            dayLabel.className = "day-label";
            dayLabel.textContent = label;
            cell.append(dayLabel);
          }
          row.append(cell);
        }
        fragment.append(row); weekStart = addDays(weekStart, 7);
      }
      root.replaceChildren(fragment);
    }
    function countInvestmentDays(start, end) {
      let count = 0;
      for (let d = dateOnly(start); d <= end; d = addDays(d, 1)) {
        const weekday = d.getDay();
        if (weekday !== 0 && weekday !== 6 && !holidayMap.has(dateKey(d))) count++;
      }
      return count;
    }
    function render() {
      const now = new Date(), today = dateOnly(now);
      const grid = document.getElementById("progress-grid"); grid.replaceChildren();
      const start = addDays(today, -((today.getDay() + 6) % 7)), end = new Date(today.getFullYear() + 1, 11, 31);

      const nextHoliday = holidayRanges
        .map(([name, from, to]) => ({ name, start: new Date(from + "T00:00:00"), end: new Date(to + "T00:00:00") }))
        .filter(item => item.end >= today)
        .sort((a, b) => a.start - b.start)[0];
      const holidayCard = document.createElement("article");
      holidayCard.className = "panel progress-card";
      if (nextHoliday) {
        const days = Math.max(0, diffDays(today, nextHoliday.start));
        holidayCard.innerHTML = `<div class="investment-mark"><span class="investment-number">${days}</span><span class="investment-unit">天</span></div><div class="progress-info"><div class="period-name">距离下一个假期</div><div class="period-dates">${nextHoliday.name} · ${fmt(nextHoliday.start)}</div><div class="period-foot"><span>${days === 0 ? "假期已开始" : `还有 ${days} 天`}</span></div></div>`;
      } else {
        holidayCard.innerHTML = `<div class="investment-mark"><span class="investment-number">—</span><span class="investment-unit">暂无</span></div><div class="progress-info"><div class="period-name">距离下一个假期</div><div class="period-dates">尚未配置后续假期日期</div></div>`;
      }
      grid.append(holidayCard);

      const investmentDays = countInvestmentDays(today, end);
      const investment = document.createElement("article");
      investment.className = "panel progress-card";
      investment.innerHTML = `<div class="investment-mark"><span class="investment-number">${investmentDays}</span><span class="investment-unit">个交易日</span></div><div class="progress-info"><div class="period-name">剩余投资日</div><div class="period-dates">${fmt(today)} — ${fmt(end)}</div><div class="period-foot"><span>不含周末及工作日假期</span></div></div>`;
      grid.append(investment);

      for (const [name, startDate, endDate] of periods(today)) {
        const el = document.createElement("progress-ring");
        el.data = { name, start: startDate, end: endDate, now: today };
        grid.append(el);
      }
      renderWeeks(today, start, end);
    }
    const root = document.documentElement, themeButton = document.getElementById("theme-toggle");
    function setTheme(theme) {
      root.dataset.theme = theme;
      const dark = theme === "dark";
      themeButton.setAttribute("aria-pressed", String(dark));
      themeButton.setAttribute("aria-label", dark ? "切换到浅色模式" : "切换到深色模式");
    }
    let saved = "dark";
    try { saved = localStorage.getItem("washi-calendar-theme") || "dark" } catch (e) { }
    setTheme(saved === "light" ? "light" : "dark");
    themeButton.addEventListener("click", () => {
      const next = root.dataset.theme === "dark" ? "light" : "dark"; setTheme(next);
      try { localStorage.setItem("washi-calendar-theme", next) } catch (e) { }
    });
    render();
  </script>
</body>

</html>
